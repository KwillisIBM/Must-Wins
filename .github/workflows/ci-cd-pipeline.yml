name: CI/CD Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  OPENSHIFT_REGISTRY: 'image-registry.openshift-image-registry.svc:5000'
  OPENSHIFT_NAMESPACE: 'content-studio-platform'
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  # Job 1: Lint and Test
  test:
    name: Lint & Test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint || echo "No lint script found"

      - name: Run tests
        run: npm test || echo "No test script found"

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # Job 2: Security Scan
  security:
    name: Security Scan
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Check for secrets
        run: |
          echo "Checking for exposed secrets..."
          if grep -r "ghp_" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github; then
            echo "⚠️ Warning: Potential GitHub token found!"
            exit 1
          fi
          echo "✅ No secrets found"

  # Job 3: Build and Push Docker Image to OpenShift Registry
  build-push:
    name: Build & Push to OpenShift
    runs-on: self-hosted
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Log in to OpenShift Registry
        run: |
          echo "Logging in to OpenShift internal registry..."
          echo "${{ secrets.OPENSHIFT_TOKEN }}" | docker login -u unused --password-stdin ${{ env.OPENSHIFT_REGISTRY }}

      - name: Prepare build context
        run: |
          # Use production dockerignore that allows dist/ folder
          cp .dockerignore.prod .dockerignore
          ls -la dist/ || echo "Warning: dist folder not found"

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_TAG="${{ env.OPENSHIFT_REGISTRY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.OPENSHIFT_REGISTRY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest"
          echo "tags=$IMAGE_TAG,$IMAGE_LATEST" >> $GITHUB_OUTPUT
          echo "Building image: $IMAGE_TAG"

      - name: Build Docker image
        run: |
          # Use production Dockerfile that expects pre-built dist/
          docker build -f Dockerfile.prod \
                       -t ${{ env.OPENSHIFT_REGISTRY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.OPENSHIFT_REGISTRY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest \
                       .

      - name: Push Docker image to OpenShift Registry
        run: |
          echo "Pushing image to OpenShift internal registry..."
          docker push ${{ env.OPENSHIFT_REGISTRY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.OPENSHIFT_REGISTRY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Image pushed successfully to OpenShift!"

  # Job 4: Deploy to Production (Golden Path pulls the image)
  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [test, security, build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ env.IMAGE_NAME }}-np.dinero.techzone.ibm.com
    steps:
      - name: Trigger Golden Path Deployment
        run: |
          echo "🚀 Triggering deployment via webhook..."
          echo "Golden Path will pull the pre-built image from OpenShift registry"
          IMAGE_URL="${{ env.OPENSHIFT_REGISTRY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest"
          echo "Image: $IMAGE_URL"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            https://webhook-receiver-content-studio-platform.dinero.techzone.ibm.com/trigger \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"${{ secrets.WEBHOOK_SECRET }}\", \"image_url\": \"$IMAGE_URL\"}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Deployment triggered successfully!"
            JOB_NAME=$(echo "$BODY" | grep -o '"job": "[^"]*"' | cut -d'"' -f4)
            echo "📦 Golden Path Job: $JOB_NAME"
            echo "🔗 App will be available at: https://${{ env.IMAGE_NAME }}-np.dinero.techzone.ibm.com"
            echo ""
            echo "⏳ Deployment typically takes 5-10 minutes"
            echo "📊 Monitor progress in OpenShift console"
          else
            echo "❌ Deployment trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi

